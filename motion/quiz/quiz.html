<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>VAMOS — Commentary Quiz</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--accent:#9ad00c;--ink:#000}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{font-family:'Readex Pro',sans-serif;color:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  /* competition backdrop: rotating light rays, LED dots, floating question marks, sweeping spotlights */
  #rays{position:absolute;left:50%;top:38%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;
        background:repeating-conic-gradient(from 0deg,rgba(154,208,12,.13) 0deg 7deg,transparent 7deg 20deg);
        -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 30%,transparent 62%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 30%,transparent 62%)}
  #dots{position:absolute;inset:0;background-image:radial-gradient(rgba(154,208,12,.22) 2.2px,transparent 2.6px);background-size:30px 30px;
        -webkit-mask:linear-gradient(to top,#000 0,transparent 32%,transparent 75%,rgba(0,0,0,.6) 100%);mask:linear-gradient(to top,#000 0,transparent 32%,transparent 75%,rgba(0,0,0,.6) 100%)}
  .qm{position:absolute;font-family:Figtree,sans-serif;font-weight:900;color:transparent;-webkit-text-stroke:3px rgba(154,208,12,.35);line-height:1}
  .beam{position:absolute;top:-200px;width:420px;height:2400px;transform-origin:50% 0;
        background:linear-gradient(to bottom,rgba(154,208,12,.42),rgba(154,208,12,.08) 55%,transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(6px);mix-blend-mode:screen}
  #beamL{left:-60px}#beamR{right:-60px}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(214,255,120,.85),rgba(154,208,12,.25) 40%,transparent 70%);opacity:0}
  .blob{position:absolute;border-radius:50%;filter:blur(120px);background:var(--accent)}
  .lock{display:inline-flex;align-items:center;gap:26px;direction:ltr}
  .lock img{display:block}
  .lock i{width:3px;background:rgba(255,255,255,.35);align-self:stretch}
  .lock span{background:var(--accent);color:#000;font-family:'Readex Pro',sans-serif;font-weight:700;border-radius:60px;direction:rtl}
  #bigQ{position:absolute;left:50%;top:40%;font-family:Figtree,sans-serif;font-weight:900;font-size:520px;line-height:1;color:var(--accent);
        text-shadow:0 0 60px rgba(154,208,12,.7),0 20px 0 #3d5404;width:600px;margin-left:-300px;text-align:center;transform-origin:50% 60%}
  #ring{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:14px solid var(--accent);opacity:0}
  .cf{position:absolute;left:540px;top:820px;width:18px;height:30px;border-radius:4px}
  #b1{width:760px;height:760px;left:-300px;top:120px;opacity:.20}
  #b2{width:640px;height:640px;right:-300px;top:1250px;opacity:.12}
  #bigword{display:none;position:absolute;top:720px;left:0;white-space:nowrap;font-family:Figtree,sans-serif;font-weight:900;font-size:500px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.06)}

  /* hook */
  #hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;direction:rtl}
  #hLock img{height:96px}#hLock i{height:96px}#hLock span{font-size:48px;padding:8px 34px 16px}
  #hLock{margin-top:430px}
  #hQ{font-size:78px;font-weight:700;line-height:1.25;margin-top:34px;padding:0 60px}
  #hQ em{font-style:normal;color:var(--accent)}
  #hSub{font-size:38px;font-weight:500;color:rgba(255,255,255,.7);margin-top:22px}

  /* quiz screen */
  #top{position:absolute;top:150px;left:0;right:0;text-align:center;direction:rtl}
  #tLock img{height:62px}#tLock span{font-size:32px;padding:5px 24px 11px}
  #tTitle{font-size:64px;font-weight:700;margin-top:18px;line-height:1.2}
  #tTitle em{font-style:normal;color:var(--accent)}
  #tv{position:absolute;left:40px;top:470px;width:1000px;height:760px;border-radius:44px;overflow:hidden;background:#0b0c0f;
      box-shadow:0 0 0 4px rgba(154,208,12,.85),0 0 90px rgba(154,208,12,.25),0 40px 120px rgba(0,0,0,.7)}
  #tv svg{position:absolute;inset:0;width:100%;height:100%}
  #wipe{position:absolute;top:0;bottom:0;width:140%;left:-20%;background:var(--accent);transform:skewX(-14deg) translateX(-120%)}
  #bug{position:absolute;left:26px;top:24px;display:flex;align-items:center;gap:10px;font-family:Figtree,sans-serif;font-weight:800;font-size:26px;direction:ltr}
  #bug span{background:rgba(0,0,0,.72);padding:6px 14px;border-radius:8px}
  #bug .sc{background:var(--accent);color:#000}
  #live{position:absolute;right:26px;top:24px;font-family:Figtree,sans-serif;font-weight:800;font-size:24px;background:rgba(0,0,0,.72);padding:6px 14px;border-radius:8px;display:flex;gap:10px;align-items:center}
  #live i{width:14px;height:14px;border-radius:50%;background:#ff3b3b}
  #eq{position:absolute;left:0;right:0;top:1290px;height:150px;display:flex;align-items:center;justify-content:center;gap:9px}
  #eq i{width:14px;border-radius:10px;background:var(--accent);height:10px}
  #listen{position:absolute;top:1460px;left:0;right:0;text-align:center;font-size:40px;font-weight:600;direction:rtl}
  #listen b{color:var(--accent);font-weight:700}
  #url{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-family:Figtree,sans-serif;font-weight:800;font-size:38px;letter-spacing:6px;color:rgba(255,255,255,.55)}

  /* question */
  #ask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;direction:rtl;background:radial-gradient(circle at 50% 45%,rgba(154,208,12,.22),rgba(0,0,0,.94) 60%)}
  #aQ{font-size:100px;font-weight:700;line-height:1.2}
  #aQ em{font-style:normal;color:var(--accent);font-family:Figtree,sans-serif;font-weight:900}
  #aS{font-size:62px;font-weight:700;margin-top:24px;padding:0 50px;line-height:1.3}
  #aC{margin-top:60px;background:var(--accent);color:#000;font-size:46px;font-weight:700;padding:16px 52px 24px;border-radius:90px}
  #aLogo{margin-top:110px;display:flex;flex-direction:column;align-items:center;gap:22px}
  #aLogo img:first-child{width:130px}#aLogo img:last-child{width:330px}
  #aTag{font-family:Figtree,sans-serif;font-weight:500;font-size:30px;letter-spacing:12px;color:var(--accent);margin-top:22px;direction:ltr}
</style>
</head>

<script src="env.js"></script>
<script>
/* audio (commentary) starts at A0 in the video; scene cuts follow the source clip */
const A0 = 3.6, CUT_B = A0 + 8.5, CUT_C = A0 + 15.3, ASK = A0 + 17.2, DURATION = ASK + 6;
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const E = {
  o: x => 1 - Math.pow(1 - x, 3),
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
};
const p = (t, a, b, e = E.io) => e(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;

/* equaliser bars driven by the commentary loudness */
const BARS = 34;
/* floating outline question marks */
const QMS = [];
for (let i = 0; i < 12; i++) {
  const d = document.createElement('div'); d.className = 'qm'; d.textContent = '؟';
  const q = {d, x: (i * 97) % 1080 - 60, y: (i * 389) % 1920, s: 90 + (i * 53) % 220, v: 18 + (i * 7) % 30, r: (i % 2 ? 1 : -1) * (6 + i % 5 * 3), ph: i * 1.3};
  d.style.fontSize = q.s + 'px'; $('qms').appendChild(d); QMS.push(q);
}
/* confetti burst when the big question mark lands */
const CF = [];
for (let i = 0; i < 40; i++) {
  const d = document.createElement('i'); d.className = 'cf'; d.style.background = ['#9ad00c', '#ffffff', '#d6ff78', '#3d5404'][i % 4]; $('cfs').appendChild(d);
  const a = (i / 40) * Math.PI * 2 + (i % 3) * .2, sp = 900 + (i * 137) % 700;
  CF.push({d, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 500, r: (i * 47) % 720 - 360});
}
const LAND = .95;
for (let i = 0; i < BARS; i++) $('eq').appendChild(document.createElement('i'));
const env = t => { const i = Math.floor((t - A0) * 60); return i >= 0 && i < ENV.length ? ENV[i] : 0; };

/* pitch: stripes + players */
const SVGNS = 'http://www.w3.org/2000/svg';
for (let i = 0; i < 10; i++) { const r = document.createElementNS(SVGNS, 'rect'); Object.entries({x: i * 100, y: 0, width: 100, height: 760, fill: i % 2 ? '#123014' : '#0e2710'}).forEach(([k, v]) => r.setAttribute(k, v)); $('stripes').appendChild(r); }
const PL = [];
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 16; i++) {
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('r', 17); c.setAttribute('fill', i < 8 ? '#9ad00c' : '#f2f2f2'); c.setAttribute('stroke', '#000'); c.setAttribute('stroke-width', 3);
  $('players').appendChild(c);
  PL.push({c, x: 200 + rnd() * 600, y: 120 + rnd() * 520, ax: 30 + rnd() * 60, ay: 20 + rnd() * 50, f: .6 + rnd() * .9, ph: rnd() * 6, dx: (i < 8 ? 1 : .6) * (50 + rnd() * 80)});
}
const BALL = [[380, 420], [520, 360], [610, 470], [720, 390], [860, 380]];

function render(t) {
  $('rays').style.transform = `rotate(${t * 9}deg) scale(${1 + .06 * Math.sin(t * 1.4)})`;
  $('dots').style.backgroundPosition = `0 ${-t * 22}px`;
  QMS.forEach(q => { q.d.style.transform = `translate(${q.x + Math.sin(t * .5 + q.ph) * 30}px,${((q.y - t * q.v * 4) % 2100 + 2100) % 2100 - 180}px) rotate(${Math.sin(t * .4 + q.ph) * q.r}deg)`; });
  const sweep = Math.sin(t * 1.1);
  $('beamL').style.transform = `rotate(${-28 + sweep * 18 + (1 - p(t, 0, .6, E.o)) * -40}deg)`;
  $('beamR').style.transform = `rotate(${28 - sweep * 18 + (1 - p(t, 0, .6, E.o)) * 40}deg)`;
  const bo = p(t, 0, .4) * (1 - .55 * p(t, A0 - .3, A0 + .4));
  $('beamL').style.opacity = $('beamR').style.opacity = bo;
  $('flash').style.opacity = Math.max(0, 1 - Math.abs(t - LAND) / .18) * .9 + Math.max(0, 1 - Math.abs(t - A0) / .15) * .5;
  $('b1').style.transform = `translate(${Math.sin(t * .4) * 80}px,${Math.cos(t * .3) * 120}px)`;
  $('b2').style.transform = `translate(${Math.cos(t * .35) * 90}px,${Math.sin(t * .45) * 100}px)`;

  /* hook */
  const hOut = p(t, A0 - .5, A0);
  $('hook').style.opacity = 1 - hOut;
  $('hook').style.transform = `scale(${1 - hOut * .12})`;
  /* big ? falls spinning, slams down, then lifts away as the logo lockup arrives */
  const fall = p(t, .25, LAND, E.io), up = p(t, 1.55, 2.05, E.io);
  const squash = 1 - .22 * Math.max(0, 1 - Math.abs(t - LAND - .06) / .12);
  $('bigQ').style.opacity = clamp((t - .2) * 6);
  $('bigQ').style.transform = `translateY(${lerp(-1300, 0, fall) + up * -330}px) rotateY(${(1 - fall) * 720}deg) rotate(${(1 - fall) * -25}deg) scale(${lerp(1, .55, up) / squash},${lerp(1, .55, up) * squash})`;
  const rk = clamp((t - LAND) / .6);
  $('ring').style.opacity = t >= LAND ? (1 - rk) : 0;
  $('ring').style.transform = `scale(${.4 + rk * 4.2})`;
  CF.forEach(c => { const s = Math.max(0, t - LAND); c.d.style.opacity = s > 0 ? clamp(1.6 - s) : 0;
    c.d.style.transform = `translate(${c.vx * s * .55}px,${c.vy * s * .55 + 1100 * s * s}px) rotate(${c.r * s}deg)`; });
  const lk = p(t, 1.75, 2.3, E.back);
  $('hLock').style.opacity = clamp(lk * 1.5); $('hLock').style.transform = `scale(${lerp(.5, 1, lk)})`;
  [['hQ', 2.15], ['hSub', 2.45]].forEach(([id, d]) => { const k = p(t, d, d + .45, E.back); $(id).style.opacity = clamp(k); $(id).style.transform = `scale(${lerp(.7, 1, k)})`; });

  /* quiz screen in/out */
  const qIn = p(t, A0 - .4, A0 + .3, E.o), qOut = p(t, ASK - .2, ASK + .4);
  $('tv').style.transform = `translateY(${(1 - qIn) * 1500}px) scale(${lerp(1, .9, qOut)})`;
  $('tv').style.opacity = (qIn > 0 ? 1 : 0) * (1 - qOut);
  ['top', 'eq', 'listen', 'url'].forEach((id, i) => { const k = p(t, A0 - .2 + i * .1, A0 + .3 + i * .1, E.o); $(id).style.opacity = k * (1 - qOut); });
  $('top').style.transform = `translateY(${(1 - p(t, A0 - .2, A0 + .3, E.o)) * -40}px)`;
  $('live').style.opacity = .55 + .45 * Math.abs(Math.sin(t * 3));

  /* scenes + wipes */
  $('sA').style.display = t < CUT_B ? '' : 'none';
  $('sB').style.display = t >= CUT_B && t < CUT_C ? '' : 'none';
  $('sC').style.display = t >= CUT_C ? '' : 'none';
  const w = [CUT_B, CUT_C].map(c => p(t, c - .22, c + .22, E.io)).find(k => k > 0 && k < 1);
  $('wipe').style.transform = `skewX(-14deg) translateX(${w === undefined ? -120 : lerp(-120, 120, w)}%)`;

  /* scene A: slow push-in, breathing, head drooping and lifting */
  const ta = t - A0;
  $('camA').setAttribute('transform', `translate(500 380) scale(${1 + ta * .012}) translate(-500 -380)`);
  $('torsoA').setAttribute('transform', `translate(0 ${Math.sin(ta * 1.6) * 3}) scale(1 ${1 + Math.sin(ta * 1.6) * .006})`);
  const droop = Math.sin(ta * .55) * 5 + Math.sin(ta * 1.3) * 1.5;
  $('headA').setAttribute('transform', `translate(${Math.sin(ta * .4) * 6} ${-318 + Math.sin(ta * 1.6) * 3}) rotate(${droop})`);

  /* scene B: drift across, head turning, breathing */
  const tb = t - CUT_B;
  $('camB').setAttribute('transform', `translate(500 380) scale(${1.04 + tb * .01}) translate(${-500 - tb * 6} -380)`);
  $('torsoB').setAttribute('transform', `translate(0 ${Math.sin(tb * 1.5) * 3})`);
  $('headB').setAttribute('transform', `translate(${-10 + Math.sin(tb * .5) * 6} ${-338 + Math.sin(tb * 1.5) * 3}) rotate(${Math.sin(tb * .7) * 6 - 2})`);

  /* scene C: players running, ball passed along */
  const tc = Math.max(0, t - CUT_C);
  PL.forEach(q => q.c.setAttribute('transform', `translate(${q.x + tc * q.dx + Math.sin(tc * q.f * 3 + q.ph) * q.ax} ${q.y + Math.cos(tc * q.f * 2.4 + q.ph) * q.ay})`));
  const seg = Math.min(BALL.length - 2, Math.floor(tc / .45)), bk = E.io(clamp((tc - seg * .45) / .45));
  $('ball').setAttribute('cx', lerp(BALL[seg][0], BALL[seg + 1][0], bk)); $('ball').setAttribute('cy', lerp(BALL[seg][1], BALL[seg + 1][1], bk));
  $('camC').setAttribute('transform', `translate(500 380) scale(${1.15 + tc * .04}) translate(${-500 - tc * 40} -380)`);

  /* equaliser */
  [...$('eq').children].forEach((b, i) => {
    const mid = 1 - Math.abs(i - (BARS - 1) / 2) / (BARS / 2);
    const lv = env(t - Math.abs(i - BARS / 2) * .012);
    b.style.height = (10 + lv * 130 * (.35 + .65 * mid) * (.75 + .25 * Math.sin(i * 1.7 + t * 9))) + 'px';
  });

  /* question */
  const aIn = p(t, ASK, ASK + .5, E.o);
  $('ask').style.opacity = aIn;
  [['aQ', .1], ['aS', .35], ['aC', .65], ['aLogo', 1.0], ['aTag', 1.3]].forEach(([id, d]) => {
    const k = p(t, ASK + d, ASK + d + .5, id === 'aC' ? E.back : E.o);
    $(id).style.opacity = clamp(k); $(id).style.transform = id === 'aC' ? `scale(${lerp(.6, 1, k) * (1 + Math.sin(Math.max(0, t - ASK - 1.2) * 4) * .03)})` : `translateY(${(1 - k) * 40}px)`;
  });
}
function frame(t) { render(t); }

window.__ready = (async () => {
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await document.fonts.ready;
  await Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 40px "Readex Pro"`, 'مسابقة'))
    .concat(['500', '800', '900'].map(w => document.fonts.load(`${w} 40px Figtree`))));
  frame(0);
  return true;
})();
window.frame = frame; window.DURATION = DURATION;

const qs = new URLSearchParams(location.search);
if (!qs.has('render')) window.__ready.then(() => {
  if (qs.has('t')) return frame(+qs.get('t'));
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
