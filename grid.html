<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit Detail Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
    .lib .it { position: relative; aspect-ratio: 9 / 16; border-radius: 8px; background: #0003 center/cover no-repeat; border: 1px solid var(--line); }
    .lib .it span {
      position: absolute; left: 4px; bottom: 4px; right: 4px; font-size: 10px; font-weight: 700;
      background: rgba(0,0,0,.7); border-radius: 4px; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .cells button {
      min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
      color: var(--muted); font: inherit; font-weight: 700; cursor: pointer;
    }
    .cells button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .cells button.empty { border-style: dashed; }
    .slider { display: grid; grid-template-columns: 58px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .export-status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 20px; }
    .export-status.ok { color: var(--accent); }
    .export-status.err { color: var(--danger); }
    .preview { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .stage-box { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); }
    .preview-meta { font-size: 12px; color: var(--muted); }
    @media (max-width: 900px) { .preview { order: -1; } }

    /* 1080x1920 stage — html2canvas-safe CSS only */
    #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; }
    #stage .cell { position: absolute; overflow: hidden; cursor: pointer; }
    #stage .cell .img { position: absolute; background-repeat: no-repeat; background-size: 100% 100%; }
    #stage .cell .ph {
      position: absolute; left: 0; right: 0; top: 50%; margin-top: -20px; text-align: center;
      font: 700 30px/40px 'Inter', sans-serif; color: rgba(0,0,0,.25);
    }
    #stage .sel { position: absolute; border: 6px solid #c6ff3d; pointer-events: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">KIT<span>/</span>STUDIO</a>
    <nav class="nav">
      <a href="prompts.html">Prompts</a>
      <a href="story.html">Story</a>
      <a href="grid.html" class="active">Grid</a>
    </nav>
  </header>

  <main class="wrap grid">
    <section>
      <div class="card">
        <h2>Photos</h2>
        <div class="lib" id="lib"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn grow" id="addBtn">Add photos</button>
          <button class="btn primary grow" id="autoBtn">Auto-fill grid</button>
        </div>
        <input type="file" id="addFile" accept="image/*" multiple class="hidden">
        <p class="hint">Add shots in order: 1 front · 2 three-quarter · 3 chest · 4 crest macro · 5 sleeve · 6 collar. Auto-fill builds all 9 cells, using zoomed crops for the fabric close-ups.</p>
      </div>

      <div class="card">
        <h2>Cell</h2>
        <div class="cells" id="cellPick"></div>
        <label class="field"><span>Photo</span><select id="cellSrc"></select></label>
        <div id="cellSliders"></div>
      </div>

      <div class="card">
        <h2>Grid</h2>
        <label class="slider"><span>Gutter</span><input type="range" id="gutter" min="0" max="30" value="8"><span id="gutterVal">8</span></label>
        <div class="row" style="margin-top:8px">
          <input type="color" id="gutterColor" value="#ffffff">
          <span class="muted small">Gutter color</span>
        </div>
      </div>

      <div class="card">
        <button class="btn primary block" id="exportBtn">Export PNG · 1080×1920</button>
        <div class="export-status" id="exportStatus"></div>
      </div>
    </section>

    <section class="preview sticky">
      <div class="stage-box" id="stageBox"><div id="stage"></div></div>
      <div class="preview-meta" id="meta">1080 × 1920 preview</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/grid.js"></script>
</body>
</html>
