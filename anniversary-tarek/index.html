<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
svg{display:block}
.ru{font-family:'Aref Ruqaa',serif;font-weight:700}
.ca{font-family:'Cairo',sans-serif}
.gv{font-family:'Great Vibes',cursive}
</style></head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const W=1080,BEAT=60/68;
const S=[0.0,7.56,20.73,30.74,39.14,59.28,68.74,79.64,87.33,95.73,102.76,114.59,119.96,133.94,150.79,158.7,171.45];
const NS=S.length-1;
const LAND=new URLSearchParams(location.search).has('land');
const RX=r=>LAND?-1300+r*2400:r*1080;
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,a,d=.5)=>{const p=P(t,a,d);return p<=0?0:back(p)};
const lerp=(a,b,p)=>a+(b-a)*p;
const beatPulse=t=>Math.exp(-((t%BEAT)/BEAT)*5);
const rnd=(i,k=0)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
const SKIN='#F0C3A0', SKIN_T='#D9A27E', HAIR='#22170F';
const g=(id,x,y,inner,extra='')=>`<g id="${id}" data-x="${x}" data-y="${y}" transform="translate(${x} ${y})" ${extra}>${inner}</g>`;
const HEART='M0 18 C-6 12 -22 2 -22 -9 C-22 -19 -14 -24 -7 -24 C-3 -24 0 -21 0 -17 C0 -21 3 -24 7 -24 C14 -24 22 -19 22 -9 C22 2 6 12 0 18Z';

/* ============ characters ============ */
function eyes(r,look,cy,glass,gcol){
  const ex=r*.36,ey=cy-r*.04,lx=look*r*.16;
  let s=`<ellipse cx="${-ex+lx}" cy="${ey}" rx="${r*.075}" ry="${r*.105}" fill="#2a1c1c"/><ellipse cx="${ex+lx}" cy="${ey}" rx="${r*.075}" ry="${r*.105}" fill="#2a1c1c"/>`;
  if(glass){const w=r*.42,h=r*.3,sw=glass==='thin'?r*.05:r*.085;
    s+=`<rect x="${-ex-w/2}" y="${ey-h/2}" width="${w}" height="${h}" rx="${glass==='thin'?h*.45:h*.2}" fill="#fff" fill-opacity=".12" stroke="${gcol}" stroke-width="${sw}"/>
        <rect x="${ex-w/2}" y="${ey-h/2}" width="${w}" height="${h}" rx="${glass==='thin'?h*.45:h*.2}" fill="#fff" fill-opacity=".12" stroke="${gcol}" stroke-width="${sw}"/>
        <path d="M${-ex+w/2} ${ey-h*.1} Q0 ${ey-h*.4} ${ex-w/2} ${ey-h*.1}" stroke="${gcol}" stroke-width="${sw}" fill="none"/>
        <path d="M${-ex-w/2} ${ey-h*.2} L${-r*.95} ${ey-h*.35} M${ex+w/2} ${ey-h*.2} L${r*.95} ${ey-h*.35}" stroke="${gcol}" stroke-width="${sw}"/>`;}
  return s;
}
function mouth(r,look,cy,id){
  const lx=look*r*.16;
  return `<circle cx="${-r*.36*1.35+lx}" cy="${cy+r*.27}" r="${r*.14}" fill="#F27B86" opacity=".45" class="blush"/>
  <circle cx="${r*.36*1.35+lx}" cy="${cy+r*.27}" r="${r*.14}" fill="#F27B86" opacity=".45" class="blush"/>
  <path d="M${-r*.2+lx} ${cy+r*.32} Q${lx} ${cy+r*.5} ${r*.2+lx} ${cy+r*.32}" stroke="#8a3b3b" stroke-width="${r*.065}" fill="none" stroke-linecap="round"/>`;
}
function arm(id,side,ang,color,hold=''){
  const x=side*58;
  return `<g id="${id}" data-x="${x}" data-y="-300" transform="translate(${x} -300) rotate(${ang})">
   <rect x="-15" y="-6" width="30" height="156" rx="15" fill="${color}"/>
   <circle cx="0" cy="152" r="16" fill="${SKIN}"/>${hold}</g>`;
}
function holdItem(id,kind){
  if(kind==='case') return g(id,0,160,`<rect x="-10" y="-6" width="20" height="14" rx="5" fill="none" stroke="#5A3A22" stroke-width="5"/><rect x="-40" y="6" width="80" height="58" rx="8" fill="#7A4A2A"/><rect x="-40" y="24" width="80" height="5" fill="#5A3A22"/>`);
  if(kind==='bag') return g(id,0,150,`<rect x="-42" y="-10" width="84" height="70" rx="12" fill="#3C6E71"/><rect x="-42" y="10" width="84" height="8" fill="#2B5154"/><path d="M-20 -10 Q0 -36 20 -10" stroke="#2B5154" stroke-width="7" fill="none"/>`);
  if(kind==='crutch') return g(id,0,0,`<rect x="-6" y="-40" width="12" height="380" rx="6" fill="#9AA4AE"/><rect x="-30" y="-48" width="60" height="16" rx="8" fill="#6C7780"/><rect x="-14" y="150" width="28" height="12" rx="6" fill="#6C7780"/><rect x="-9" y="330" width="18" height="16" rx="5" fill="#333"/>`);
  if(kind==='seeds') return g(id,0,160,`<path d="M-22 -10 L22 -10 L0 40Z" fill="#F4E3C1" stroke="#C9A86A" stroke-width="3"/>${[[-10,-14],[0,-18],[10,-13],[-4,-22],[6,-24]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#fff" stroke="#888" stroke-width="1"/>`).join('')}`);
  if(kind==='phone') return g(id,0,150,`<rect x="-18" y="-34" width="36" height="66" rx="7" fill="#222"/><rect x="-14" y="-28" width="28" height="52" rx="4" fill="#7FC8F8"/>`);
  if(kind==='tray') return g(id,0,150,`<rect x="-60" y="-6" width="120" height="12" rx="6" fill="#C99A62"/><path d="M-30 -6 Q0 -50 30 -6Z" fill="#fff"/><path d="M-6 -40 q8 -10 0 -20 q-8 -10 0 -20" stroke="#fff" stroke-width="4" fill="none" opacity=".7"/>`);
  if(kind==='mug') return g(id,0,150,`<rect x="-18" y="-26" width="36" height="40" rx="6" fill="#F2A541"/><path d="M18 -18 q14 0 12 12 q-2 9 -14 7" stroke="#F2A541" stroke-width="6" fill="none"/>`);
  if(kind==='spoon') return g(id,0,150,`<rect x="-4" y="-80" width="8" height="90" rx="4" fill="#8A5A3B"/><ellipse cx="0" cy="-86" rx="14" ry="18" fill="#8A5A3B"/>`);
  return '';
}
function man(id,o={}){
  const {look=0,outfit='casual',pose='stand',armL=6,armR=-6,holdL='',holdR='',headS=1,hair=HAIR,glass='thick',gcol='#2B2B33',beard=true,mustache=false,kid=false,knee=false,pants='#2B2D42'}=o;
  let top='url(#plaid)', leg=pants, deco='';
  if(outfit==='wedding'){top='#1E1F2B';leg='#1E1F2B';deco=`<path d="M-20 -312 L0 -250 L20 -312Z" fill="#fff"/><path d="M-16 -300 L0 -292 L-16 -284Z M16 -300 L0 -292 L16 -284Z" fill="#B3264C"/><circle cx="0" cy="-292" r="5" fill="#B3264C"/><path d="M-20 -312 L-6 -230 M20 -312 L6 -230" stroke="#0f1018" stroke-width="5"/><path d="M30 -270 l16 0" stroke="#F3C6CF" stroke-width="8" stroke-linecap="round"/>`;}
  else if(outfit==='blazer'){top='#2C3E66';deco=`<path d="M-20 -312 L0 -252 L20 -312Z" fill="#fff"/><path d="M-20 -312 L-6 -230 M20 -312 L6 -230" stroke="#1d2a47" stroke-width="5"/><rect x="-6" y="-300" width="12" height="40" fill="#8E2B4A"/>`;}
  else if(outfit==='uniform'){top='#1F2A44';deco=`<path d="M-58 -232 L58 -232 L58 -165 L-58 -165Z" fill="#2E9E6B"/><rect x="-60" y="-246" width="120" height="10" fill="#fff"/><rect x="-60" y="-232" width="120" height="5" fill="#1F2A44"/>
     <path d="M-18 -314 L-8 -250 L8 -250 L18 -314" stroke="#2D6CDF" stroke-width="5" fill="none"/><rect x="-16" y="-252" width="32" height="40" rx="4" fill="#fff" stroke="#2D6CDF" stroke-width="3"/><rect x="-10" y="-246" width="12" height="14" fill="#9CC9F2"/>`;}
  else if(outfit==='galabeya'){top='#8C7B62';leg='#8C7B62';}
  else if(outfit==='apron'){deco=`<path d="M-40 -270 L40 -270 L46 -165 L-46 -165Z" fill="#fff"/><path d="M-40 -270 Q0 -300 40 -270" stroke="#E9476F" stroke-width="5" fill="none"/><rect x="-46" y="-205" width="92" height="8" fill="#E9476F"/>`;}
  if(outfit==='casual'||outfit==='apron') deco=`<path d="M-18 -314 L0 -288 L18 -314Z" fill="${SKIN}"/><path d="M-24 -316 L-4 -292 L-12 -316Z M24 -316 L4 -292 L12 -316Z" fill="#fff"/>`+deco;
  let legs='';
  if(pose==='stand') legs=`<rect x="-46" y="-180" width="38" height="175" rx="16" fill="${leg}"/><rect x="8" y="-180" width="38" height="175" rx="16" fill="${leg}"/>
    ${knee?`<rect x="6" y="-110" width="42" height="40" rx="10" fill="#fff"/><path d="M8 -98 h38 M8 -84 h38" stroke="#ddd" stroke-width="3"/>`:''}
    <ellipse cx="-30" cy="-6" rx="30" ry="12" fill="#1a1a1a"/><ellipse cx="30" cy="-6" rx="30" ry="12" fill="#1a1a1a"/>`;
  if(outfit==='galabeya') legs=`<path d="M-60 -200 L-66 -10 L66 -10 L60 -200Z" fill="${leg}"/><ellipse cx="-26" cy="-6" rx="26" ry="10" fill="#5a3a22"/><ellipse cx="26" cy="-6" rx="26" ry="10" fill="#5a3a22"/>`;
  const hairPath=`<path d="M-53 -2 Q-60 -58 -30 -66 Q-20 -78 -2 -70 Q12 -80 28 -68 Q56 -64 53 -2 Q48 -32 26 -40 Q10 -30 -6 -38 Q-26 -30 -42 -36 Q-50 -22 -53 -2Z" fill="${hair}"/>
     ${[-34,-14,8,30].map((x,i)=>`<circle cx="${x}" cy="${-62+(i%2)*4}" r="11" fill="${hair}"/>`).join('')}`;
  const beardP=beard?`<path d="M-44 14 Q-40 56 0 62 Q40 56 44 14 Q36 40 0 44 Q-36 40 -44 14Z" fill="#3a2a20" opacity=".55"/><path d="M-16 34 Q0 28 16 34" stroke="#3a2a20" stroke-width="5" opacity=".6" fill="none"/>`:'';
  const must=mustache?`<path d="M-20 30 Q0 20 20 30 Q0 26 -20 30Z" fill="${hair}" stroke="${hair}" stroke-width="5"/>`:'';
  return `<g id="${id}">${legs}
    ${arm(id+'_al',-1,armL,top,holdL?holdItem(id+'_holdL',holdL):'')}
    <path d="M-64 -296 Q-66 -314 -46 -316 L46 -316 Q66 -314 64 -296 L58 -165 L-58 -165Z" fill="${top}"/>${deco}
    <rect x="-15" y="-336" width="30" height="28" fill="${SKIN}"/>
    ${arm(id+'_ar',1,armR,top,holdR?holdItem(id+'_hold',holdR):'')}
    <g id="${id}_h" data-x="0" data-y="-382" transform="translate(0 -382)"><g transform="scale(${headS})">
      <ellipse cx="-50" cy="4" rx="9" ry="13" fill="${SKIN}"/><ellipse cx="50" cy="4" rx="9" ry="13" fill="${SKIN}"/>
      <circle r="50" fill="${SKIN}"/>${hairPath}${beardP}${must}
      ${eyes(50,look,4,glass,gcol)}${mouth(50,look,4)}
      <g id="${id}_tears" opacity="0"><ellipse cx="${-18+look*8}" cy="22" rx="4" ry="7" fill="#9CD3FF"/><ellipse cx="${18+look*8}" cy="22" rx="4" ry="7" fill="#9CD3FF"/></g>
    </g></g></g>`;
}
const zeyad=(id,o={})=>man(id,{outfit:'uniform',pants:'#1a1a1a',glass:'thick',gcol:'#B3263A',beard:false,headS:1.32,hair:'#2a1a12',...o});
function woman(id,o={}){
  const {look=0,outfit='casual',armL=6,armR=-6,dress='#33506B',hijab='#1E9E96',hold='',headS=1,armsFront=false,holdR='',preg=false}=o;
  const wed=outfit==='wedding';
  const d=wed?'#FFFFFF':dress, hj=wed?'#FFFBFB':hijab;
  const skirt=wed?`M-62 -298 Q-66 -316 -46 -318 L46 -318 Q66 -316 62 -298 L145 -8 Q0 18 -145 -8Z`:`M-60 -298 Q-64 -316 -46 -318 L46 -318 Q64 -316 60 -298 L80 -10 Q0 4 -80 -10Z`;
  const veil=wed?`<path d="M-34 -440 Q-170 -220 -160 -8 L160 -8 Q170 -220 34 -440Z" fill="#fff" opacity=".45"/>`:'';
  const wdeco=wed?`<path d="M-40 -230 Q0 -210 40 -230" stroke="#F1D9A0" stroke-width="6" fill="none"/>${[[-90,-60],[-40,-30],[20,-50],[80,-70],[-110,-150],[100,-160]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#F3C6CF"/>`).join('')}`
     :`<path d="M-50 -250 Q0 -232 50 -250" stroke="${hijab}" stroke-width="6" fill="none" opacity=".6"/>`;
  let holdM='';
  if(hold==='baby'){holdM=g(id+'_hold',0,-205,`<ellipse cx="0" cy="0" rx="74" ry="40" fill="#9CC9F2"/><path d="M-74 0 Q-40 30 30 30" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/>
      <circle cx="-38" cy="-12" r="27" fill="#9CC9F2"/><circle cx="-38" cy="-8" r="21" fill="${SKIN}"/>
      <path d="M-46 -8 q4 3 8 0 M-36 -8 q4 3 8 0" stroke="#2a1c1c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="-48" cy="1" r="4" fill="#F27B86" opacity=".5"/><circle cx="-26" cy="1" r="4" fill="#F27B86" opacity=".5"/>`);}
  const bouquet=wed?`<g transform="translate(0 -170)">${[[-18,0,'#F27B9A'],[16,-4,'#F9C6D3'],[0,-20,'#E9476F'],[-4,14,'#fff'],[22,14,'#F27B9A'],[-24,18,'#F9C6D3']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="15" fill="${c}"/>`).join('')}<path d="M-6 30 L0 70 L6 30" fill="#6FA36A"/></g>`:'';
  const pg=preg?g(id+'_baby',0,-200,`<circle r="46" fill="#FFE3A0" opacity=".35"/><use href="#hp" fill="#F27B9A" transform="scale(1.1)"/>`,'opacity="0"'):'';
  const arms=arm(id+'_al',-1,armL,d)+arm(id+'_ar',1,armR,d,holdR?holdItem(id+'_hr',holdR):'');
  return `<g id="${id}">${veil}
    <ellipse cx="-26" cy="-6" rx="24" ry="10" fill="#3a2a3a"/><ellipse cx="26" cy="-6" rx="24" ry="10" fill="#3a2a3a"/>
    ${armsFront?'':arm(id+'_al',-1,armL,d)}
    <path d="${skirt}" fill="${d}"/>${wdeco}${pg}
    ${armsFront?'':arm(id+'_ar',1,armR,d,holdR?holdItem(id+'_hr',holdR):'')}
    ${holdM}${bouquet}
    <g id="${id}_h" data-x="0" data-y="-380" transform="translate(0 -380)"><g transform="scale(${headS})">
      <path d="M-62 0 Q-74 74 -64 104 L64 104 Q74 74 62 0Z" fill="${hj}"/>
      <circle r="60" fill="${hj}"/>
      <ellipse cx="0" cy="8" rx="40" ry="44" fill="${SKIN}"/>
      <path d="M-44 34 Q0 76 44 34 L58 92 Q0 116 -58 92Z" fill="${hj}"/>
      <path d="M-44 -22 Q0 -46 44 -22" stroke="${wed?'#EEE':'#17837C'}" stroke-width="6" fill="none" opacity=".7"/>
      ${wed?`<g transform="translate(0 -56)"><path d="M-30 6 L-18 -10 L-8 2 L0 -16 L8 2 L18 -10 L30 6Z" fill="#F1C96B"/><circle cx="0" cy="-14" r="4" fill="#fff"/></g>`:''}
      ${eyes(42,look,10,'thin','#6B6F78')}${mouth(42,look,10)}
      <g id="${id}_tears" opacity="0"><ellipse id="${id}_t1" cx="${-15+look*7}" cy="24" rx="4" ry="7" fill="#7CC4FF"/><ellipse id="${id}_t2" cx="${15+look*7}" cy="24" rx="4" ry="7" fill="#7CC4FF"/></g>
    </g></g>
    ${armsFront?arms:''}
  </g>`;
}

/* ============ text ============ */
function wtext(id,x,y,size,cls,fill,txt,extra=''){
  return `<g class="tx"><clipPath id="${id}_cp"><rect id="${id}_cr" x="-400" y="${y-size*1.4}" width="0" height="${size*2.1}"/></clipPath>
   <g clip-path="url(#${id}_cp)">${g(id,0,0,`<text x="${x}" y="${y}" class="${cls}" font-size="${size}" fill="${fill}" text-anchor="middle" direction="rtl" filter="url(#tsh)" ${extra}>${txt}</text>`)}</g></g>`;
}
function ftext(id,x,y,size,cls,fill,txt,extra=''){
  return '<g class="tx">'+g(id,x,y,`<text x="0" y="0" class="${cls}" font-size="${size}" fill="${fill}" text-anchor="middle" direction="rtl" filter="url(#tsh)" ${extra}>${txt}</text>`,'opacity="0"')+'</g>';
}
function chip(id,x,y,txt,col='#fff',bg='#00000040'){
  return '<g class="tx">'+g(id,x,y,`<rect x="-190" y="-44" width="380" height="72" rx="36" fill="${bg}" stroke="url(#gold)" stroke-width="3"/><text x="0" y="8" class="ca" font-size="44" font-weight="900" fill="${col}" text-anchor="middle" letter-spacing="2">${txt}</text>`,'opacity="0"')+'</g>';
}

/* ============ particles ============ */
function hearts(pre,n,colors){let s='';for(let i=0;i<n;i++) s+=`<use id="${pre}${i}" href="#hp" fill="${colors[i%colors.length]}" opacity="0"/>`;return s;}
function updHearts(pre,n,u,x0,x1,y0,y1,start=0,period=3.2){
  for(let i=0;i<n;i++){const e=$(pre+i); if(!e) continue;
    const lt=u-start-rnd(i,1)*period*.6; if(lt<0){e.setAttribute('opacity',0);continue}
    const ph=(lt%period)/period;
    const x=((LAND&&x1-x0>600)?RX(rnd(i,2)):lerp(x0,x1,rnd(i,2)))+Math.sin(lt*2+i)*22, y=lerp(y1,y0,ph);
    e.setAttribute('transform',`translate(${x} ${y}) scale(${.5+rnd(i,3)*.9})`);
    e.setAttribute('opacity',Math.sin(ph*Math.PI)*.9);}
}
function confetti(pre,n){const C=['#F27B9A','#F6C760','#FFFFFF','#E9476F','#9CC9F2','#F9C6D3'];let s='';
  for(let i=0;i<n;i++) s+= i%3===0?`<use id="${pre}${i}" href="#hp" fill="${C[i%6]}"/>`:`<rect id="${pre}${i}" x="-9" y="-5" width="18" height="10" rx="${i%2?5:1}" fill="${C[i%6]}"/>`;return s;}
function updConfetti(pre,n,u,start){
  for(let i=0;i<n;i++){const e=$(pre+i); const lt=u-start; if(lt<0){e.setAttribute('opacity',0);continue}
    const sp=180+rnd(i,4)*220, y=-60+((lt*sp+rnd(i,5)*2000)%2050), x=RX(rnd(i,6))+Math.sin(lt*1.6+i)*50;
    e.setAttribute('transform',`translate(${x} ${y}) rotate(${lt*120*(rnd(i,7)-.5)*4}) scale(${i%3===0?.6:1} ${Math.cos(lt*4+i)})`);
    e.setAttribute('opacity',clamp(lt*2)*.95);}
}
const sun=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r*1.8}" fill="${c}" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const cloud=(id,x,y,s)=>g(id,x,y,`<g transform="scale(${s})" fill="#fff" opacity=".9"><ellipse rx="90" ry="40"/><ellipse cx="-50" cy="10" rx="60" ry="32"/><ellipse cx="55" cy="12" rx="60" ry="30"/><ellipse cx="10" cy="-25" rx="55" ry="40"/></g>`);
const icon=(id,x,y,inner,bg='#fff')=>g(id,x,y,`<circle r="70" fill="${bg}" opacity=".95"/><circle r="70" fill="none" stroke="#F6C760" stroke-width="5"/>${inner}`,'opacity="0"');
const star5=(c)=>`<circle r="60" fill="${c}" opacity=".35"/><path d="M0 -40 L11 -12 L40 -12 L17 6 L25 36 L0 18 L-25 36 L-17 6 L-40 -12 L-11 -12Z" fill="${c}"/>`;
const calendar=(id,x,y)=>g(id,x,y,`<rect x="-90" y="-80" width="180" height="170" rx="16" fill="#fff"/><rect x="-90" y="-80" width="180" height="48" rx="16" fill="#E9476F"/><rect x="-90" y="-50" width="180" height="18" fill="#E9476F"/><circle cx="-45" cy="-84" r="8" fill="#555"/><circle cx="45" cy="-84" r="8" fill="#555"/><text id="${id}_n" x="0" y="60" class="ca" font-size="84" font-weight="900" fill="#33506B" text-anchor="middle"></text><text id="${id}_l" x="0" y="-44" class="ca" font-size="28" font-weight="900" fill="#fff" text-anchor="middle"></text>`,'opacity="0"');

/* ============ scenes ============ */
function sceneMarkup(){
 const sc=[];
 /* 0 INTRO */
 sc.push(`<rect width="1080" height="1920" fill="url(#gIntro)"/>
  <clipPath id="heartClip"><path d="M540 1290 C110 1000 170 520 540 690 C910 520 970 1000 540 1290Z"/></clipPath>
  <path id="i_hfill" d="M540 1290 C110 1000 170 520 540 690 C910 520 970 1000 540 1290Z" fill="#9EE0D8" opacity=".16"/>
  <g clip-path="url(#heartClip)">${g('i_cpl',0,0,`<g transform="translate(540 1500) scale(1.3)">`+g('i_m',-105,0,man('im',{look:1}))+g('i_w',105,0,woman('iw',{look:-1}))+`</g>`,'opacity="0"')}</g>
  ${g('i_frame',540,960,`<path id="i_hpath" d="M0 330 C-430 40 -370 -440 0 -270 C370 -440 430 40 0 330Z" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>`)}
  ${ftext('i_t0',540,440,54,'ca','#F6C760','إلى أميرة… من طارق','font-weight="700"')}
  ${wtext('i_t1',540,1490,124,'ru','url(#gold)','طارق <tspan fill="#F27B9A">♥</tspan> أميرة')}
